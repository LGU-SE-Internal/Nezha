[project]
name = "nezha"
version = "2.0.0"
description = "Optimized service-level root cause analysis for microservices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=0.20.0",
    "pyarrow>=20.0.0",
    "rcabench-platform==0.4.1"
]

[build-system]
requires = ["uv_build>=0.7.12,<0.8.0"]
build-backend = "uv_build"

[tool.pyright]
exclude = [ #
    ".git",
    "**/__pycache__",
    ".venv",
    ".vscode",
    ".idea",
    "data/",
    "output/",
    "temp/",
]

[dependency-groups]
dev = [ #
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "marimo[recommended]>=0.14.10",
    "kubernetes-stubs-elephant-fork>=33.1.0",
    "plotly>=6.2.0",
    "pyqt6>=6.9.1",
    "pyright>=1.1.403",
    "ruff>=0.12.2",
    "vegafusion>=2.0.2",
    "vl-convert-python>=1.8.0",
    "pandas-stubs>=2.3.0.250703",
    "uv-bump>=0.1.2",
]
